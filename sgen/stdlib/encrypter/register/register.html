<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Demo</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="dialog-overlay hidden" id="dialog-overlay">
        <div class="dialog">
            <div class="dialog-header">Complete</div>
            <div class="dialog-content">
                <p>
                    <b>WARNING: KEEP THE CODE SECRET</b>
                </p>
                <p>
                    Here is your authentication code:
                </p>
                <div class="copy-container">
                    <textarea id="authentication-code" readonly></textarea>
                    <button class="copy-btn" onclick="copyText()">Copy</button>
                </div>

                <script>
                    const copyText = () => {
                        const textarea = document.querySelector(".copy-container textarea");
                        const value = textarea.value;
                        navigator.clipboard.writeText(value);
                    };
                </script>
            </div>
            <div class="dialog-actions">
                <button class="dialog-btn dialog-btn-primary"
                    onclick="document.querySelector('#dialog-overlay').classList.add('hidden')">
                    Close
                </button>
            </div>
        </div>
    </div>

    <h2>Register</h2>

    <!-- Username -->
    <input type="text" id="username" placeholder="Username">

    <!-- Password UI -->
    <label><input type="checkbox" id="method-password"> Password</label>
    <div id="password-box" class="box hidden">
        <h4>Password Setup</h4>
        <input type="password" id="password" placeholder="Password">
    </div>

    <!-- WebAuthn UI -->
    <label><input type="checkbox" id="method-webauthn"> WebAuthn</label>
    <div id="webauthn-box" class="box hidden">
        <h4>WebAuthn</h4>
        <button id="webauthn">Register WebAuthn</button>
    </div>

    <!-- Fingerprint -->
    <label><input type="checkbox" id="method-button"> Browser Fingerprint</label>
    <div id="fingerprint-box" class="box hidden">
        <h4>Browser Fingerprint</h4>
        <button id="fingerprint">Register Fingerprint</button>
    </div>

    <button id="register">Register</button>

    <script type="module" src="./register.js"></script>
</body>

</html>
